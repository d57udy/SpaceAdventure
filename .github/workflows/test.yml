name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Service worker version is up to date
        run: npm run sw:check
      - id: unit
        run: npm run test:unit
      # Chromium and WebKit run as separate steps: CI WebKit has no GPU and draws ~3 fps,
      # so it gets fewer workers. Each step keeps its own results folder.
      - name: Playwright (Chromium)
        env:
          PW_WORKERS: 4   # GitHub runners are dedicated; local runs stay at 2
        run: npx playwright test --project=desktop-chromium --project=ipad-chromium-touch --project=pixel-chromium --project=pwa-chromium --project=pwa-subpath --output=test-results/chromium
      - name: Playwright (WebKit)
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        env:
          PW_WORKERS: 2
        run: npx playwright test --project=ipad-webkit --project=ipad-webkit-landscape --output=test-results/webkit
      # Lobby / intro / in-game screenshots for review without a local browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
