<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-title" content="Space Adv">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <title>Space Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <!-- UI Elements like Score, Lives, Level will be drawn on canvas or overlaid -->
        <div class="ui-overlay">
            <div id="user-display">User: ---</div>
            <div id="score">Score: 0</div>
            <div id="credits">Credits: 0</div>
            <div id="lives">Lives: 3</div>
            <div id="level">Level: 1</div>
        </div>

        <!-- Username entry (a real input so tablets show their on-screen keyboard) -->
        <form id="user-prompt" class="user-prompt hidden" autocomplete="off">
            <label for="username-input">Enter Username (3-10 letters or digits)</label>
            <input id="username-input" name="username" type="text" maxlength="10"
                   autocomplete="off" autocorrect="off" autocapitalize="characters"
                   spellcheck="false" enterkeyhint="done" inputmode="text">
            <button type="submit" id="username-submit">OK</button>
            <div id="username-error" class="prompt-error" aria-live="polite"></div>
        </form>
    </div>

    <!-- Touch Controls (shown on touch devices while playing) -->
    <div class="touch-controls" aria-hidden="true">
        <!-- Drag-to-steer area (left half); the stick appears where the finger lands -->
        <div class="joystick-zone" id="joystick-zone">
            <div class="joystick-base" id="joystick-base"><div class="joystick-knob" id="joystick-knob"></div></div>
        </div>
        <div class="touch-left">
            <button id="touch-left-btn" class="touch-btn rotate-left" data-action="rotateLeft" aria-label="Rotate left"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg></button>
            <button id="touch-right-btn" class="touch-btn rotate-right" data-action="rotateRight" aria-label="Rotate right"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></button>
        </div>
        <div class="touch-right">
            <button id="touch-hyper-btn" class="touch-btn hyper" data-action="hyperspace" aria-label="Hyperspace"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"/></svg></button>
            <button id="touch-thrust-btn" class="touch-btn thrust" data-action="thrust" aria-label="Thrust"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41z"/></svg></button>
            <button id="touch-fire-btn" class="touch-btn fire" data-action="fire" aria-label="Fire"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="5"/></svg></button>
        </div>
        <div class="touch-top">
            <button id="touch-mute-btn" class="touch-btn small" data-action="toggleMute" aria-label="Mute"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12z"/></svg></button>
            <button id="touch-pause-btn" class="touch-btn small" data-action="pause" aria-label="Pause"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
        </div>
        <!-- Local multiplayer, player in zone B (right half, side by side). Shown only in
             multiplayer with a touch player in that zone (body.mp-active.mp-zone-b). -->
        <div class="touch-zone-b" data-zone="b">
            <div class="joystick-zone joystick-zone-b" id="joystick-zone-b"></div>
            <div class="mp-cluster mp-cluster-b">
                <button id="touch-hyper-btn-b" class="touch-btn hyper" data-action="hyperspace" aria-label="Hyperspace (right player)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"/></svg></button>
                <button id="touch-fire-btn-b" class="touch-btn fire" data-action="fire" aria-label="Fire (right player)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="5"/></svg></button>
            </div>
            <button id="touch-pause-btn-b" class="touch-btn small mp-pause-b" data-action="pause" aria-label="Pause (right player)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
        </div>
        <!-- Stick visuals of other zones follow the finger in page coordinates, so they live in
             an unrotated layer (plan 05 finding 7) -->
        <div class="joystick-layer">
            <div class="joystick-base joystick-base-b" id="joystick-base-b"><div class="joystick-knob" id="joystick-knob-b"></div></div>
        </div>
    </div>

    <!-- Local multiplayer: per-player HUD panels in the side bars (js/hud.js SeatHudView) -->
    <div class="mp-hud" id="mp-hud" aria-live="off">
        <div class="mp-hud-col mp-hud-left" id="mp-hud-left"></div>
        <div class="mp-hud-col mp-hud-right" id="mp-hud-right"></div>
    </div>

    <!-- Local multiplayer lobby on touch devices: tap your side's pad to join / ready,
         hold it to leave -->
    <div class="mp-join-pads" aria-hidden="true">
        <button type="button" class="touch-btn join-pad" id="join-pad-a" data-join="a"><span class="join-pad-title">LEFT PLAYER</span><span class="join-pad-text" id="join-pad-a-text">Tap to join</span><span class="join-pad-hint">Hold to leave</span></button>
        <button type="button" class="touch-btn join-pad" id="join-pad-b" data-join="b"><span class="join-pad-title">RIGHT PLAYER</span><span class="join-pad-text" id="join-pad-b-text">Tap to join</span><span class="join-pad-hint">Hold to leave</span></button>
    </div>

    <!-- Side by side needs landscape (shown when Side by side is chosen on a portrait tablet) -->
    <div class="mp-rotate-prompt" id="mp-rotate-prompt" role="status">
        <div class="mp-rotate-icon">&#x21BB;</div>
        <div>Rotate to landscape</div>
        <div class="mp-rotate-sub">Two players sit side by side, one on each end, or choose Facing in the lobby</div>
    </div>

    <script src="js/main.js" type="module"></script>
</body>
</html>
